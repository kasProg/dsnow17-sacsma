# Matches results/runs/lstm_10yrs_spatial/ -- ~2.4s/epoch (ordinary
# batched backprop, no per-basin Fortran/Tesseract calls), so 150 epochs
# is ~6 minutes total over the 9-year split=spatial window -- still
# cheap enough to run far more epochs than the hybrid model's per-epoch
# cost allows, and matched to the hybrid model's own 150 epochs this
# time (the earlier 3-year pilot, results/runs/benchmark_lstm_spatial_seed0/,
# gave this model 6x the hybrid model's epoch count -- see
# results/README.md).
n_epochs: 150
eval_every: 10
lr: 1e-3
