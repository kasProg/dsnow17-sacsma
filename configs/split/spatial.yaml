# Prediction-in-ungauged-basins (PUB): one fixed date window, basins
# partitioned into train/test by data.selected_basins_csv's own "split"
# column (train/heldout), written once by data/select_basins.py. This is
# the split every results/ JSON so far uses.
#
# Window starts WY1991 because it's verified (not assumed) full daily
# coverage and <=5% missing streamflow across all 45 selected basins --
# see notes/logs.md for the window search (WY1981-83 and WY1986-88 each
# failed for 5-6 basins). Originally WY1991-1993 (3 years); extended
# through WY1999 (9 years) once the same coverage check was confirmed
# to hold over the longer range -- see notes/logs.md's 10-year-window
# entry and results/README.md's primary comparison.
mode: spatial
window:
  start: "1990-10-01"
  end: "1999-09-30"
