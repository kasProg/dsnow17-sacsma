# Tesseract configuration for the SAC-SMA wrapper.
# See tesseracts/sacsma/tesseract_api.py for the endpoint implementations.

name: "sacsma"
version: "0.1.0"
description: >
  Differentiable SAC-SMA (NOAA-OWP, Apache-2.0) wrapped for Tesseract.
  apply() runs EXSAC over a daily time series for one HRU via
  fortran/sacsma_shim.f90 (built against a build-time-patched copy of
  sac1.f90 -- see patches/ and notes/NOTES.md for the upstream defect
  this fixes); vector_jacobian_product() computes gradients w.r.t. the
  16 learnable scalar parameters by forward-difference finite differences
  over full rollouts. Composed with tesseracts/snow17/ via
  src/coupling.py, not via standard automatic Tesseract composition --
  see notes/NOTES.md's "why we bypass tesseract-torch's automatic
  composition" writeup.

env:
  # See tesseracts/snow17/tesseract_config.yaml's identical setting and
  # tesseract_api.py's _REPO_ROOT comment for why.
  TESSERACT_PROJECT_ROOT: "/tesseract"

build_config:
  target_platform: "native"

  # gfortran to compile the shim inside the container; patch to apply
  # patches/sac1_bypass_ratio_check_save_fix.patch at build time, exactly
  # like fortran/sacsma_build.sh does locally -- same reasoning as
  # snow17's config for why this isn't a shipped host-built .so.
  extra_packages:
    - gfortran
    - patch

  # Only the sac/ physics subdir is copied, not the whole sac-sma
  # submodule. patches/ ships the disclosed, minimal build-time patch --
  # see notes/NOTES.md for what it fixes and why external/sac-sma itself
  # is never modified.
  package_data:
    - [../../fortran, /tesseract/fortran]
    - [../../external/sac-sma/src/sac, /tesseract/external/sac-sma/src/sac]
    - [../../patches, /tesseract/patches]
    - [../../src, /tesseract/src]

  # Same build script `make build` uses locally -- stages a copy of
  # sac1.f90, applies the patch, compiles. One place that knows how to
  # build this shim, not a container-specific reimplementation of it.
  custom_build_steps:
    - "RUN /tesseract/fortran/sacsma_build.sh"
