data:
  name: camels_snow35
  camels_dir: data/camels
  selected_basins_csv: data/camels/selected_basins.csv
  attributes_npz: data/camels/basin_attributes.npz
  climatology_npz: data/camels/basin_climatology.npz
split:
  mode: spatial
  window:
    start: '1990-10-01'
    end: '1993-09-30'
model:
  name: benchmark_lstm
  hidden: 64
  dropout: 0.1
train:
  n_epochs: 150
  eval_every: 10
  lr: 0.001
seed: 0
output_dir: results/runs/benchmark_lstm_spatial_seed0
